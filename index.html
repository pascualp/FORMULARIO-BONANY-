<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solicitud de catálogo</title>

  <style>
    :root{
      --text:#222;
      --border:#e5e7eb;
      --btn:#111;
      --btnText:#fff;
      --max:760px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:#fff;
    }

    /* Banner */
    .banner{
      height:240px;
      border-bottom:1px solid #eee;
      background-image:url("https://files.imagetourl.net/uploads/1769513991051-697888dc-6ad0-4948-a024-c107e166e364.png");
      background-size:cover;
      background-position:center;
    }

    .container{
      max-width:var(--max);
      margin:0 auto;
      padding:28px 16px 60px;
      text-align:center;
    }

    h1{
      margin:14px 0 24px;
      font-size:30px;
      line-height:1.15;
    }

    .formCard{
      width:min(520px, 92vw);
      margin:0 auto;
      text-align:left;
    }

    .field{ margin:18px 0; }

    label{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      font-weight:600;
      margin-bottom:8px;
    }
    .req{ font-weight:700; }

    input[type="text"],
    input[type="email"],
    input[type="tel"]{
      width:100%;
      height:44px;
      font-size:16px; /* evita zoom en iPhone */
      border:1px solid var(--border);
      border-radius:10px;
      padding:0 12px;
      outline:none;
      background:#fff;
    }
    input:focus{
      border-color:#cbd5e1;
      box-shadow:0 0 0 3px rgba(148,163,184,.25);
    }

    .checkRow{
      display:flex;
      gap:10px;
      align-items:flex-start;
      margin-top:10px;
      font-size:14px;
      line-height:1.35;
    }
    .checkRow input{
      margin-top:4px;
      width:18px;
      height:18px;
      flex:0 0 auto;
    }

    .actions{ margin-top:18px; }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:var(--btn);
      color:var(--btnText);
      border:0;
      border-radius:10px;
      height:44px;
      padding:0 14px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      width:auto;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .msg{
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:10px;
      font-size:14px;
    }
    .ok{ background:#eaf7ee; }
    .err{ background:#fdeaea; }

    @media (max-width: 520px){
      .banner{ height:160px; background-position:center 35%; }
      .container{ padding:18px 14px 44px; }
      h1{ font-size:24px; margin:10px 0 18px; }
      .formCard{ width:100%; }
      .field{ margin:14px 0; }
      .btn{ width:100%; }
    }
  </style>
</head>

<body>
  <header class="banner"></header>

  <main class="container">
    <h1>Solicitud de catálogo</h1>

    <section class="formCard">

      <!-- Envío SIN abrir pestaña: se envía al iframe oculto -->
      <form
        id="leadForm"
        action="https://script.google.com/macros/s/AKfycbz2B1u32x4cVK49Rl9stRiCVbPQR4g4URs5iIOlU1rVL_0dT8Lb4S9_fbukLgKngWzCcQ/exec"
        method="POST"
        target="hidden_iframe"
      >
        <div class="field">
          <label>Nombre <span class="req">*</span></label>
          <input name="nombre" type="text" required />
        </div>

        <div class="field">
          <label>Apellido <span class="req">*</span></label>
          <input name="apellido" type="text" required />
        </div>

        <div class="field">
          <label>Número de teléfono <span class="req">*</span></label>
          <input name="telefono" type="tel" required />
        </div>

        <div class="field">
          <label>Correo electrónico <span class="req">*</span></label>
          <input name="email" type="email" required />
        </div>

        <div class="field">
          <label>Cargo <span class="req">*</span></label>
          <input name="cargo" type="text" required />
        </div>

        <div class="field">
          <label>Empresa <span class="req">*</span></label>
          <input name="empresa" type="text" required />
        </div>

        <div class="checkRow">
          <input id="consent" name="consent" type="checkbox" required />
          <label for="consent" style="margin:0; font-weight:500;">
            Acepto la política de privacidad y recibir el catálogo por email. <span class="req">*</span>
          </label>
        </div>

        <div class="actions">
          <button id="submitBtn" class="btn" type="submit">
            Enviar <span aria-hidden="true">→</span>
          </button>
        </div>

        <div id="ok" class="msg ok"></div>
        <div id="err" class="msg err"></div>
      </form>

      <!-- iframe oculto -->
      <iframe name="hidden_iframe" style="display:none;"></iframe>

    </section>
  </main>

  <script>
    // Solo feedback visual (el envío real lo hace el form al iframe)
    const form = document.getElementById("leadForm");
    const btn = document.getElementById("submitBtn");
    const okBox = document.getElementById("ok");
    const errBox = document.getElementById("err");

    function show(box, text){
      okBox.style.display = "none";
      errBox.style.display = "none";
      box.textContent = text;
      box.style.display = "block";
    }

    form.addEventListener("submit", () => {
      if (!form.checkValidity()) return;

      btn.disabled = true;
      show(okBox, "Enviando...");

      // No podemos leer la respuesta del iframe.
      // Si falla, lo verás en Apps Script > Executions.
      setTimeout(() => {
        show(okBox, "¡Listo! Te enviamos el catálogo en PDF a tu correo.");
        form.reset();
        btn.disabled = false;
      }, 1200);
    });
  </script>
</body>
</html>
